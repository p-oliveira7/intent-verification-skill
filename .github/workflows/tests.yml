name: Intent skill tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run contract, triage and Git integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Run synthetic cancellation acceptance tests
        run: python3 -m unittest discover -s examples/cancellation/project/tests -v
